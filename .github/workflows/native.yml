name: Native

# The Expo module compiled into an app on each platform, as a user's `expo prebuild` would. Only when something
# that reaches the native builds changed: a README edit does not need two native builds.
on:
  push:
    branches: [main]
    paths:
      - cpp/**
      - ios/**
      - android/**
      - vendor/**
      - bench/**
      - ReactNativeAec3.podspec
      - expo-module.config.json
      - example/**
      - src/native.ts
      - src/sharedBuffers.ts
      - package.json
      - package-lock.json
      - .github/workflows/native.yml
  pull_request:
    paths:
      - cpp/**
      - ios/**
      - android/**
      - vendor/**
      - bench/**
      - ReactNativeAec3.podspec
      - expo-module.config.json
      - example/**
      - src/native.ts
      - src/sharedBuffers.ts
      - package.json
      - package-lock.json
      - .github/workflows/native.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm pack
      - run: cd example && npm install
      - run: cd example && npx expo prebuild --platform ios --no-install
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            example/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package.json', 'example/package.json', 'example/ios/Podfile') }}
          restore-keys: pods-${{ runner.os }}-
      - run: cd example/ios && LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 pod install
      # Both simulator slices: the x86_64 one compiles the SSE2 and AVX2 kernels under -mavx2 -mfma and the podspec's
      # per-architecture exclusion lists, which arm64 never touches and a vendoring update is most likely to break.
      - run: >
          cd example/ios && xcodebuild -workspace AEC3Example.xcworkspace -scheme AEC3Example -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/derived
          CODE_SIGNING_ALLOWED=NO build | tail -5; test ${PIPESTATUS[0]} -eq 0
      # The bench: the same vendored sources built for a Mac, with the harness, on the runner already here.
      - run: cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build bench/build --target harness --parallel "$(sysctl -n hw.ncpu)"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm pack
      - run: cd example && npm install
      - name: NDK version React Native pins
        id: ndk
        run: echo "version=$(sed -n 's/^ndkVersion = "\(.*\)"/\1/p' example/node_modules/react-native/gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - name: Cache the NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}
      - run: cd example && npx expo prebuild --platform android --no-install
      - run: cd example/android && ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon -q
